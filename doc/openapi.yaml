          - RETIRADA
          - EN_CAMINO
          - COMPLETADA
          - CANCELADA
        fechaCreacion:
          type: string
          format: date-time
        fechaAsignacion:
          type: string
          format: date-time
        fechaRetiro:
          type: string
          format: date-time
        fechaEntrega:
          type: string
          format: date-time
    RegistrarRetiroRequest:
      type: object
      properties:
        observacion:
