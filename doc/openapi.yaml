      - codigoConfirmacion
    AsignarEntregaRequest:
      type: object
      properties:
        pedidoId:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        comercioId:
          type: integer
          format: int64
        direccionRetiro:
          type: string
          minLength: 1
        direccionEntrega:
          type: string
          minLength: 1
        repartidorId:
