# Perfil "integracion": Logistica llama a los modulos reales en lugar de los mocks.
#   ./mvnw spring-boot:run "-Dspring-boot.run.profiles=integracion"
# Hoy cubre Usuarios (UsuariosClientHttp) y Notificaciones (NotificacionesClientHttp).
# Pedidos y Analitica siguen con sus mocks.
#
# Las variables no tienen valor por defecto a proposito: si falta una, la app no arranca
# y el error se ve enseguida, en vez de descubrirlo en la demo con un 503.

# INT-01 Usuarios (Grupo 2): URL base y clave de modulo que entrega el Grupo 2 (MODULE_KEY_LOGISTICA)
logistica.usuarios.base-url=${USUARIOS_BASE_URL}
logistica.usuarios.clave-modulo=${MODULE_KEY_LOGISTICA}

# INT-05 Notificaciones (Grupo 1): URL base, canal y los ids de las plantillas de entregas.
# Las plantillas las crea un ADMIN en Notificaciones (POST /api/v1/templates); variables que usa Logistica:
#   asignacion-cliente: {entregaId} {codigoConfirmacion} | asignacion-repartidor, retiro, entrega: {entregaId}
# Si una plantilla no se configura, ese aviso se omite (queda un warning en el log).
logistica.notificaciones.base-url=${NOTIFICACIONES_BASE_URL}
logistica.notificaciones.canal=${NOTIFICACIONES_CANAL:IN_APP}
logistica.notificaciones.plantillas.asignacion-cliente=${NOTIF_PLANTILLA_ASIGNACION_CLIENTE:}
logistica.notificaciones.plantillas.asignacion-repartidor=${NOTIF_PLANTILLA_ASIGNACION_REPARTIDOR:}
logistica.notificaciones.plantillas.retiro=${NOTIF_PLANTILLA_RETIRO:}
logistica.notificaciones.plantillas.entrega=${NOTIF_PLANTILLA_ENTREGA:}
