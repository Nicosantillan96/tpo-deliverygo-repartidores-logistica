spring.application.name=deliverygo-logistica

# Base de datos H2 en memoria: se crea al iniciar y se descarta al detener la aplicacion
spring.datasource.url=jdbc:h2:mem:logistica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (solo para desarrollo)
spring.h2.console.enabled=true
