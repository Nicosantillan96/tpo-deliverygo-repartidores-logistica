spring.application.name=deliverygo-logistica

# Puerto de Logistica en la integracion (Grupo 8 -> 8088). El 8080 lo usan Usuarios y Pedidos.
# Se puede cambiar sin tocar este archivo con la variable de entorno SERVER_PORT
server.port=8088

# Base de datos H2 en memoria: se crea al iniciar y se descarta al detener la aplicacion
spring.datasource.url=jdbc:h2:mem:logistica;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola web de H2 en /h2-console (solo para desarrollo)
spring.h2.console.enabled=true

# springdoc: Swagger UI en /swagger-ui.html y el contrato OpenAPI en /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Cada linea del log muestra el X-Correlation-Id del pedido en curso (ver CorrelationIdFilter)
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# CORS: origenes que pueden llamar a /api/** desde el navegador (Frontend React).
# "*" acepta cualquiera; se puede restringir, por ejemplo: http://10.8.0.6:5173
logistica.cors.allowed-origins=*

# JWT del modulo Usuarios (HS256): secreto compartido para validar Authorization: Bearer <token>.
# Si esta vacio, el Bearer se ignora y se usa el header X-Usuario-Id (pruebas y demo)
logistica.jwt.secret=${JWT_SECRET:}
